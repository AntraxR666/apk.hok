name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 33
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate project contracts
        run: |
          python3 tools/validate_project.py
          python3 tools/validate_v4.py
          python3 tools/test_ui_contract.py
          python3 tools/test_overlay_contract.py
          python3 tools/test_overlay_scroll_contract.py
          python3 tools/test_player_slot_detection_contract.py
          python3 tools/test_player_pick_override_contract.py
          python3 tools/test_stage_control_contract.py
          python3 tools/test_calibration_contract.py

      - name: Unit tests, lint and APK
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK contents
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/hok_counters.json'
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HoK-Draft-Assistant-V4.3-RC1
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
