name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate project contracts
        run: |
          python3 tools/validate_project.py
          python3 tools/validate_v4.py
          python3 tools/test_ui_contract.py
          python3 tools/test_overlay_contract.py
          python3 tools/test_overlay_scroll_contract.py
          python3 tools/test_player_slot_detection_contract.py
          python3 tools/test_player_pick_override_contract.py
          python3 tools/test_stage_control_contract.py
          python3 tools/test_calibration_contract.py
          python3 tools/test_overlay_layout_params_contract.py
          python3 tools/test_v5_build_contract.py
          python3 tools/test_v5_background_vision_contract.py
          python3 tools/test_v5_recognition_contract.py
          python3 tools/test_v5_diagnostics_contract.py
          python3 tools/test_v5_single_fgs_contract.py
          python3 tools/test_v5_delivery_contract.py
          python3 tools/test_v5_huawei_profile_contract.py
          python3 tools/test_media_projection_nullability_contract.py
          python3 tools/test_v5_offline_manifest_contract.py
          python3 tools/validate_v5.py

      - name: Unit tests, lint and APK
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK contents
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/hok_counters.json'
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee app-debug.badging.txt
          if grep -Fq "uses-permission: name='android.permission.INTERNET'" app-debug.badging.txt; then
            echo "Unexpected INTERNET permission in final APK" >&2
            exit 1
          fi
          if grep -Fq "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" app-debug.badging.txt; then
            echo "Unexpected ACCESS_NETWORK_STATE permission in final APK" >&2
            exit 1
          fi
          grep -q "versionCode='11'" app-debug.badging.txt
          grep -q "versionName='5.0-personal-jkm-lx3-rc1'" app-debug.badging.txt
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HoK-Draft-Assistant-V5-Huawei-JKM-LX3
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            app-debug.badging.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
